<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Inference Agents</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles-dark.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .checkout-container {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .plan-badge {
      display: inline-block;
      background: rgba(99,102,241,0.15);
      color: #6366f1;
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .price {
      font-size: 2.5rem;
      font-weight: 800;
      color: #6366f1;
      margin: 16px 0 8px;
    }
    .price span {
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-muted);
    }
    .description {
      color: var(--text-muted);
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .btn-checkout {
      display: block;
      width: 100%;
      padding: 16px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn-checkout:hover { background: #4f46e5; }
    .btn-checkout:disabled { opacity: 0.6; cursor: not-allowed; }
    .security {
      margin-top: 16px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .error {
      color: #f87171;
      margin-top: 12px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="checkout-container">
    <div class="plan-badge" id="planBadge">Loading...</div>
    <h1 id="planName">Getting ready...</h1>
    <div class="price" id="planPrice"></div>
    <p class="description" id="planDesc"></p>
    <button class="btn-checkout" id="checkoutBtn" disabled>Redirecting to payment...</button>
    <p class="security">🔒 Secure payment powered by Stripe</p>
    <div class="error" id="errorMsg"></div>
  </div>

  <script>
    const plans = {
      starter:   { label: 'Starter Plan',   name: '1 AI Agent',         price: '£99',  period: '/month', desc: 'One AI agent handling enquiries, bookings, or admin for your business 24/7.' },
      growth:    { label: 'Growth Package', name: '3 AI Agents',        price: '£199', period: '/month', desc: 'Three AI agents covering multiple channels and functions simultaneously.' },
      fullstack: { label: 'Full Stack',     name: 'All AI Agents',      price: '£399', period: '/month', desc: 'The complete AI workforce — every agent we offer, fully configured for your business.' },
    };

    const params = new URLSearchParams(window.location.search);
    const plan = params.get('plan') || 'starter';
    const p = plans[plan] || plans.starter;

    document.getElementById('planBadge').textContent = p.label;
    document.getElementById('planName').textContent = p.name;
    document.getElementById('planPrice').innerHTML = p.price + ' <span>' + p.period + '</span>';
    document.getElementById('planDesc').textContent = p.desc;

    const btn = document.getElementById('checkoutBtn');
    btn.textContent = 'Proceed to Secure Checkout';
    btn.disabled = false;

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Redirecting...';
      document.getElementById('errorMsg').textContent = '';

      try {
        const res = await fetch('/api/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ plan }),
        });
        const data = await res.json();
        if (data.url) {
          window.location.href = data.url;
        } else {
          throw new Error(data.error || 'Something went wrong');
        }
      } catch (err) {
        document.getElementById('errorMsg').textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Proceed to Secure Checkout';
      }
    });
  </script>
</body>
</html>
